<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events — Події поруч</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><b><i>E</i> Events</b><button id="bell">♢</button></header><main><section class="search"><input id="q" placeholder="Знайти подію…"><div id="chips"><button class="on" data-c="all">Усі</button><button data-c="concert">🎵 Концерти</button><button data-c="street">🏙 Вуличні</button><button data-c="sport">⚽ Спорт</button><button data-c="other">✨ Інше</button></div></section><section><div class="title"><div><small>ЛЬВІВ</small><h1>Події поруч</h1></div><button id="loc">⌖ Моя локація</button></div><div class="map"><span class="pin p1" data-i="0">🎵</span><span class="pin p2" data-i="1">🎨</span><span class="pin p3" data-i="2">⚽</span><span class="pin p4" data-i="3">🍔</span><em>● 24 активні події</em></div></section><section><div class="title"><div><small>СЬОГОДНІ</small><h2>Цікаве поблизу</h2></div><button id="all">Дивитись усі</button></div><div id="list"></div></section></main><button class="fab" id="add">＋ Додати подію</button><nav><button class="active">⌂<small>Головна</small></button><button id="mapnav">⌖<small>Карта</small></button><button id="addnav" class="plus">＋</button><button>♡<small>Збережені</small></button><button>◯<small>Профіль</small></button></nav></div><dialog id="event"><button class="x">×</button><div id="ev"></div></dialog><dialog id="create"><button class="x">×</button><h2>Додати подію</h2><textarea id="desc" placeholder="Що відбувається?"></textarea><select id="cat"><option value="concert">🎵 Концерт</option><option value="street">🏙 Вулична</option><option value="sport">⚽ Спорт</option><option value="other">✨ Інше</option></select><input id="place" placeholder="Локація" value="Львів"><button id="publish">Опублікувати</button></dialog><script src="script.js"></script></body></html>
