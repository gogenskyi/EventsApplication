<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Модерація — Події поруч</title><link rel="stylesheet" href="style.css"></head><body><main class="app" style="padding:24px"><h1>Модерація подій</h1><p class="meta">Доступ тільки для moderator/admin.</p><button class="primary" id="refresh">Оновити скарги</button><div id="reports"></div><script>const api=async(u,o={})=>{const r=await fetch(u,{credentials:'include',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'ERROR');return d};async function load(){const root=document.querySelector('#reports');try{const d=await api('/api/admin/reports');root.innerHTML=d.reports.length?d.reports.map(r=>`<article class="card" style="margin:12px 0;padding:16px"><b>${r.title}</b><p>Скарга: ${r.reason}</p><p class="meta">Автор скарги: ${r.reporter_name}</p><div style="display:flex;gap:8px"><button onclick="review('${r.event_id}','verified')">✓ Перевірено</button><button onclick="review('${r.event_id}','new')">↩ Залишити</button><button onclick="review('${r.event_id}','hidden')">✕ Приховати</button></div></article>`).join(''):'<p class="meta">Відкритих скарг немає.</p>'}catch(e){root.innerHTML='<p class="form-error">Немає доступу або сервер недоступний.</p>'}}async function review(id,status){await api('/api/admin/events/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}document.querySelector('#refresh').onclick=load;load();</script></main></body></html>
