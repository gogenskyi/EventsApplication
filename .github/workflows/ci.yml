name: CI

on:
  push:
    branches: [main, feature/events-platform]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --check server.js
      - run: node --check script.js
      - run: node --check notifications.js
      - run: node --check profile-enhancements.js
