name: CI

on:
  push:
    branches: [main, feature/events-platform]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check required production files
        run: test -f index.html && test -f style.css && test -f manifest.webmanifest && test -f sw.js && test -f netlify.toml
